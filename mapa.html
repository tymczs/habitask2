<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100dvh; }
  </style>
</head>
<body>
<div id="map"></div>
<script>

const CONFIG = {
  cities: [
    { name: 'Warszawa',      level: 6 },
    { name: 'Kutno',         level: 8 },
    { name: 'Łódź',          level: 6 },
    { name: 'Gdańsk',        level: 6 },
    { name: 'Gdynia',        level: 6 },
    { name: 'Sopot',         level: 6 },
    { name: 'Bielsko-Biała', level: 8 },
    { name: 'Poznań',        level: 6 },
    { name: 'Wrocław',       level: 6 },
  ],
  rivers: [
    { name: 'Wisła',  tag: 'waterway', value: 'river' },
    { name: 'Narew',  tag: 'waterway', value: 'river' },
  ]
};

const STYLES = {
  countries: { color: '#ffffff', weight: 0.7, fillOpacity: 0 },
  cities:    { color: '#facc15', weight: 0.4, fillOpacity: 0 },
  rivers:    { color: '#38bdf8', weight: 0.8, fillOpacity: 0 }
};

const map = L.map('map', {
  center: [20, 10],
  zoom: 3,
  zoomControl: true,
  attributionControl: false
});

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19
}).addTo(map);

function renderBoundaries(elements, style) {
  elements.forEach(el => {
    const lines = (el.members ?? [])
      .filter(m => m.type === 'way')
      .map(w => w.geometry.map(p => [p.lon, p.lat]));
    L.geoJSON(
      { type: 'Feature', geometry: { type: 'MultiLineString', coordinates: lines } },
      { style }
    ).addTo(map);
  });
}

fetch('./data/data.json')
  .then(r => r.json())
  .then(db => {
    L.geoJSON(db.countries, { style: STYLES.countries }).addTo(map);
    CONFIG.cities.forEach(c  => db[c.name]  && renderBoundaries(db[c.name].elements,  STYLES.cities));
    CONFIG.rivers.forEach(r  => db[r.name]  && renderBoundaries(db[r.name].elements,  STYLES.rivers));
  });

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.smoothwheelzoom@1.0.0/dist/leaflet.smoothWheelZoom.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100dvh; }
  </style>
</head>
<body>
<div id="map"></div>
<script>
const map = L.map('map', {
  center: [20, 10],
  zoom: 3,
  zoomControl: true,
  attributionControl: false,
});

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19
}).addTo(map);

fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
  .then(r => r.json())
  .then(data => L.geoJSON(data, {
    style: { color: '#ffffff', weight: 0.7, fillOpacity: 0 }
  }).addTo(map));

  const CITIES = [
  { name: 'Warszawa',       level: 6 },
  { name: 'Kutno',          level: 8 },
  { name: 'Łódź',           level: 6 },
  { name: 'Gdańsk',         level: 6 },
  { name: 'Gdynia',         level: 6 },
  { name: 'Sopot',          level: 6 },
  { name: 'Bielsko-Biała',  level: 6 }
];

const query = `
[out:json][timeout:30];
(
${CITIES.map(c => `  relation["name"="${c.name}"]["admin_level"="${c.level}"]["boundary"="administrative"];`).join('\n')}
);
out geom;
`;

const STYLE = { color: '#facc15', weight: 0.4, opacity: 1 };

fetch('https://overpass-api.de/api/interpreter', {
  method: 'POST',
  body: 'data=' + encodeURIComponent(query)
})
  .then(r => r.json())
  .then(({ elements }) => elements.forEach(el => {
    const lines = (el.members ?? [])
      .filter(m => m.type === 'way')
      .map(w => w.geometry.map(p => [p.lon, p.lat]));

    L.geoJSON({ type: 'Feature', geometry: { type: 'MultiLineString', coordinates: lines } },
      { style: STYLE }).addTo(map);
  }));
</script>
</body>
</html>
